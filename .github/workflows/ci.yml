name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets, apcu
          ini-values: apc.enable_cli=1, error_reporting=-1
          coverage: xdebug

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run tests
        run: vendor/bin/phpunit

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sockets, apcu
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Psalm
        run: vendor/bin/psalm --output-format=github --no-cache

  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sockets, apcu
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: php-cs-fixer
        run: vendor/bin/php-cs-fixer check --allow-risky=yes --using-cache=no --diff

      - name: Rector
        run: vendor/bin/rector process --dry-run --clear-cache

      - name: Validate composer.json
        run: composer validate --strict
